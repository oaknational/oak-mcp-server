packages:
  - apps/*
  - packages/*

engineStrict: true
minimumReleaseAge: 10080

# @posthog/core 1.64 changes the fetch types that posthog-node and @posthog/mcp
# compile against. Hold the release OOCE resolved at the import pin.
# @vercel/cli-config (under @vercel/blob) pins zod 4.1.11, which has
# GHSA-mrhx-c7xc-m3w5. Lift it to the patched zod the workspace already uses.
overrides:
  '@posthog/core': 1.47.0
  # openapi-zod-client 1.18.3 pins zod ^3, and every zod 3 release is open to
  # GHSA-mrhx-c7xc-m3w5 (fixed in 4.6.6). Codegen output is unchanged under zod 4.
  'openapi-zod-client>zod': 4.6.7
  '@zodios/core>zod': 4.6.7
  '@vercel/cli-config>zod': 4.6.7
  # @mcpjam/cli (dev only, conformance runner) reaches undici 5, which pins
  # @fastify/busboy ^2. Every 2.x release is open to GHSA-x8mw-p69m-v3mx (fixed in 3.2.1).
  'undici@5>@fastify/busboy': 3.2.5

allowBuilds:
  '@sentry/cli': false
  esbuild: true
  shellcheck: true

permissions:
  dotenv:
    skills: false
