packages:
  - apps/*
  - packages/*

engineStrict: true
minimumReleaseAge: 10080

# @posthog/core 1.64 changes the fetch types that posthog-node and @posthog/mcp
# compile against. Hold the release OOCE resolved at the import pin.
overrides:
  '@posthog/core': 1.47.0

allowBuilds:
  esbuild: true
  shellcheck: true

permissions:
  dotenv:
    skills: false
