version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    # Each major bump is its own PR, so allow more than the default 5.
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Majors stay out of the group, so each one arrives as its own PR and
      # one breaking bump cannot block or hide the rest.
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.72.1 supports TypeScript below 6.1 only. Lift when a
      # typescript-eslint release supports the newer range.
      - dependency-name: typescript
        versions: ['>=6.1']
      - dependency-name: '@types/node'
        versions: ['>=25']
      # 0.24.0 pulls in re2js 2.8.6 (GHSA-gg6h-894w-4m9c, high severity). Lift when a
      # markdownlint-cli2 release depends on markdownlint 0.42.1 or later.
      - dependency-name: markdownlint-cli2
        versions: ['0.24.0']
      # 5.0.0 and later pull in re2js 2.8.6 (GHSA-gg6h-894w-4m9c, high severity)
      # through @mcpjam/sdk and @mcpjam/evaluators. Lift when a @mcpjam/cli release
      # and the @mcpjam/evaluators it resolves no longer pull in a vulnerable re2js.
      - dependency-name: '@mcpjam/cli'
        versions: ['>=5.0.0']
      # 2.0.0+ targets the split v2 SDK (@modelcontextprotocol/core/client/server),
      # dropping @modelcontextprotocol/sdk as a peer entirely. Lift once the v1->v2
      # migration (MCP-886) lands.
      - dependency-name: '@modelcontextprotocol/ext-apps'
        versions: ['>=2.0.0']
      # Every release after 0.11.4 needs @posthog/core above 1.47.0, where
      # pnpm-workspace.yaml's overrides hold it. Lift when that override can
      # move to the core version the target release needs.
      - dependency-name: '@posthog/mcp'
        versions: ['>=0.11.5']
      # Every release after 5.48.1 needs @posthog/core above 1.47.0, where
      # pnpm-workspace.yaml's overrides hold it. Lift with MCP-907.
      - dependency-name: posthog-node
        versions: ['>=5.48.2']
