version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
    groups:
      github-actions:
        patterns: ['*']
  # cooldown keeps Dependabot behind the 24 hour minimumReleaseAge in
  # pnpm-workspace.yaml, so its lockfile does not trip the install.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm:
        patterns: ['*']
