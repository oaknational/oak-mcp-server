version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Keep equal to minimumReleaseAge in pnpm-workspace.yaml, in days. A repo check enforces it.
    cooldown:
      default-days: 1
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm:
        patterns: ['*']
    ignore:
      # typescript-eslint 8.72.1 supports TypeScript below 6.1 only. Lift when a
      # typescript-eslint release supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Lift when engines.node moves to 25 or later.
      - dependency-name: '@types/node'
        versions: ['>=25']
      # 0.24.0 pulls in re2js 2.8.6 (GHSA-gg6h-894w-4m9c, high severity). Lift when a
      # markdownlint-cli2 release depends on markdownlint 0.42.1 or later.
      - dependency-name: markdownlint-cli2
        versions: ['0.24.0']
