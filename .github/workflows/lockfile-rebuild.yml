name: lockfile-rebuild

on:
  pull_request:
    paths:
      - package.json
      - '**/package.json'
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - docs/dependency-holds.md
      - tools/repo-checks/lockfile-rebuild.ts
      - .github/workflows/lockfile-rebuild.yml
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: lockfile-rebuild-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  lockfile-rebuild:
    name: lockfile-rebuild
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Rebuild the lockfile and compare
        run: node tools/repo-checks/lockfile-rebuild.ts
