name: Conformance

on:
  workflow_dispatch:
    inputs:
      target:
        description: MCP endpoint to check, as https://<host>/mcp
        required: true
        type: string
        default: https://mcp.thenational.academy/mcp

concurrency:
  group: conformance
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  conformance:
    name: conformance
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require an https /mcp endpoint
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [[ ! "$TARGET" =~ ^https://[a-z0-9.-]+/mcp$ ]]; then
            echo "::error::The target must look like https://<host>/mcp."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run the unattended suites against the committed baselines
        env:
          TARGET: ${{ inputs.target }}
        run: >-
          pnpm --filter @oaknational/mcp-server conformance
          --target "$TARGET"
          --unattended
          --report-dir "${RUNNER_TEMP}/conformance"
      - name: Upload the raw reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-reports
          path: ${{ runner.temp }}/conformance/
          retention-days: 14
