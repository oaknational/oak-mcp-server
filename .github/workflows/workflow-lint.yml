name: workflow-lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  workflow-lint:
    name: workflow-lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned actionlint and zizmor
        run: |
          fetch() {
            curl -sSfL --proto '=https' --proto-redir '=https' -o "$1" "$2"
            echo "$3  $1" | sha256sum -c -
          }
          fetch actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          sudo tar -xz -C /usr/local/bin -f actionlint.tar.gz actionlint
          fetch zizmor.tar.gz \
            https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
          sudo tar -xz -C /usr/local/bin -f zizmor.tar.gz
          actionlint -version
          zizmor --version
      - run: pnpm lint:workflows
